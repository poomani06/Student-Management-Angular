<div class="student-card">

  <h2>Student Registration</h2>

  <form #studentForm="ngForm"
        (ngSubmit)="registerStudent()">

    <label>Student Name</label>

    <input
      type="text"
      name="studentName"
      [(ngModel)]="studentName"
      required
      placeholder="Enter student name"
    >

    <label>Age</label>

    <input
      type="number"
      name="studentAge"
      [(ngModel)]="studentAge"
      required
      min="1"
      placeholder="Enter age"
    >

    <label>Department</label>

    <input
      type="text"
      name="department"
      [(ngModel)]="department"
      required
      placeholder="Enter department"
    >

    <label>Email</label>

    <input
      type="email"
      name="email"
      [(ngModel)]="email"
      required
      email
      placeholder="Enter email"
    >

    <button type="submit"
            [disabled]="studentForm.invalid">
      Register Student
    </button>

  </form>

</div>
